# QUADRO's build settings (fm1-base tools/build.py)
name = "QUADRO"
id_prefix = "FM-1_52"          # package identity: dev FM-1_5200, releases FM-1_52XXYYZZ (FM-1_96x: SID-1 and others)
usb_manufacturer = "QUADRO"
usb_product = "QUADRO FM-1"
o2 = []
ble = true                     # Bluetooth MIDI (--no-ble builds without it)
ble_stack = "own"              # fm1-base's own stack (bt/): nothing of JieLi's linked
ble_central = false
cpu2 = true                    # the second core: the strings and poly voices
cpu2_fallback = true           # one core if this unit misreads or faults (some do)
tagline = "bass strings poly lead"
repo = "https://github.com/matttallison/quadro-fm1"
licence = "GPL-3.0"
credits = "QUADRO synth, panel, reverb and delay; on fm1-base (MPL-2.0) and felucca-bsp"
words = "words.tsv"
author = "Matt"
description = "QUADRO turns the FM-1 into a four-section performance synth after the ARP Quadra: bass, string ensemble, poly and a two-voice lead play at once across a split keyboard. A 14-stage phaser, reverb and delay, one-finger chords, a clock-synced sequencer with a 16-step mode, touch bend and brilliance on the lead, MIDI in with velocity, and 105 programs, the Quadra's own sixteen first."
tags = ["synth", "chords", "sequencer", "midi"]
install = "https://matttallison.github.io/quadro-fm1/install/"
site = "https://matttallison.github.io/quadro-fm1/"
screenshot = "app/docs/img/home.png"
